[package]
name = "gns3fy-rs"
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
description = "Rust wrapper around the GNS3 server REST API (port of the Python gns3fy library)"
homepage = "https://github.com/Julien-cpsn/gns3fy-rs"
license = "MIT"
keywords = ["gns3", "networking", "api", "rest", "emulation"]
categories = ["api-bindings", "network-programming"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "stream", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
url = "2.5.8"
tokio = { version = "1.53.2", features = ["fs", "rt", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
futures = "0.3.34"