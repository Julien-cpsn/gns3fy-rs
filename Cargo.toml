[package]
name = "gns3fy"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust wrapper around the GNS3 server REST API (port of the Python gns3fy library)"
license = "MIT"
keywords = ["gns3", "networking", "api", "rest", "emulation"]
categories = ["api-bindings", "network-programming"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
url = "2"
